# Shared Elanthia Online RuboCop rules live in .rubocop/base.yml, a byte-identical
# copy of the master in elanthia-online/.github. Do not change rules here; this
# file may only list files to exclude.
inherit_from: .rubocop/base.yml

# CI lints only the files a PR changes. These exclusions keep that to scripts/
# and type_data/migrations/, as before the shared CI. ForgeMaster.lic uses Lich
# goto labels and isn't valid Ruby.
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - 'bin/**/*'
    - 'lib/**/*'
    - 'spec/**/*'
    - 'scripts/ForgeMaster.lic'
