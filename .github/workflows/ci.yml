name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Shared lint from elanthia-online/.github, pinned by full SHA. Only the files
  # a PR changes are linted (see the exclusions in .rubocop.yml). Tests need the
  # type data migrations and a lich-5 checkout, so they run in the job below.
  ruby:
    uses: elanthia-online/.github/.github/workflows/ruby-ci.yml@277eba54e8b75c7e235e459ea53076f6151a4db0
    with:
      lint-scope: changed
      run-tests: false

  # Moved here unchanged from rspec_tests.yaml so ci-gate can require it.
  test:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: 'gtk:vscode:profanity'
    name: Run tests on Ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - name: Install xmllint
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libxml2-utils
          version: 1.0
      - name: Run type data migrations to create gameobj-data.xml
        run: bin/migrate
      # Pinned deliberately: bump this ref (and re-run the suite locally
      # first) when specs need to move to a newer lich-5 release, rather than
      # floating on lich-5's main and breaking here on an unrelated change.
      - name: Checkout pinned lich-5 release for spec fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: elanthia-online/lich-5
          ref: v5.21.0
          path: tmp/lich-5
      - name: Run RSpec tests
        env:
          LICH5_PATH: ${{ github.workspace }}/tmp/lich-5
        run: bundle exec rspec
      - name: Archive gameobj-data.xml artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/gameobj-data.xml
          retention-days: 1
          overwrite: true
          archive: false

  ci-gate:
    name: ci-gate
    if: always()
    needs: [ruby, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
