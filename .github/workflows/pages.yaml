# Publishes the jinx "elanthia-online" extras repo (extras.repo.elanthia.online)
# to GitHub Pages: manifest.json + headers/ generated by bin/jinx_manifest, and
# the scripts themselves served at /assets. dist/assets is a symlink to
# scripts/, which upload-pages-artifact dereferences into the artifact, so no
# script is ever copied or committed.
name: Publish - Jinx Repo (GitHub Pages)
on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build jinx manifest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: each asset's last_commit comes from git log
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      - name: Build manifest.json and headers
        run: bin/jinx_manifest scripts dist
      - name: Serve scripts/ at /assets
        run: |
          ln -s ../scripts dist/assets
          test -f dist/assets/jinx.lic
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
